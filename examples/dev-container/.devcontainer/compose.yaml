name: dev-container-agent

services:
  broker:
    build: https://github.com/lpezet/secure-agent-lab.git#v1.3.1:stack/broker
    volumes:
      - ${HOME}/.config/agent-creds:/secrets:ro
      - ./broker:/app/providers:ro
      - audit-logs:/var/log/audit
    env_file: .env
    environment:
      GITHUB_APP_PRIVATE_KEY_PATH: /secrets/github-app.pem
      ANTHROPIC_API_KEY_PATH: /secrets/anthropic.key
      ANTHROPIC_AUTH_TOKEN_PATH: /secrets/anthropic-auth.token
      CLOUDFLARE_MINTER_TOKEN_PATH: /secrets/cloudflare-minter.token
      # Must match the proxy's CLOUDFLARE_PROFILE. The broker mints this profile
      # and refuses any other, so the lab cannot ask its way into a wider one.
      CLOUDFLARE_PROFILE: ${CLOUDFLARE_PROFILE:-workers-deploy}
      AUDIT_LOG: /var/log/audit/broker.jsonl
    networks: [secure]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  proxy:
    build: https://github.com/lpezet/secure-agent-lab.git#v1.3.1:stack/proxy
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./proxy:/addons:ro
      # Egress allowlist (opt-in). Copy 001_allowlist.py from stack/proxy/addons
      # into ./proxy, then uncomment this. Absent file = every destination
      # permitted, so the mount is what turns it on.
      # It lives here rather than in ./proxy because that directory is mounted
      # wholesale as /addons — a non-addon file in it would land there too.
      # - ./allowlist:/etc/agent-allowlist:ro
      - proxy-certs:/home/mitmproxy/.mitmproxy
      - audit-logs:/var/log/audit
    environment:
      BROKER_URL: http://broker:8080
      # Which Cloudflare profile the addon injects for. Deployment config, not
      # something the lab container may influence — see bank/cloudflare/.
      CLOUDFLARE_PROFILE: ${CLOUDFLARE_PROFILE:-workers-deploy}
      AUDIT_LOG: /var/log/audit/proxy.jsonl
    networks: [secure, lab]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  cred-gateway:
    build: https://github.com/lpezet/secure-agent-lab.git#v1.3.1:stack/cred-gateway
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      # Whitelisted endpoints. Host path only — must stay outside whatever
      # is mounted at /workspace in lab, or the agent could widen it.
      - ./cred-gateway:/etc/nginx/gateway.d:ro
      - audit-logs:/var/log/audit
    networks: [secure, lab]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # Reads the audit-logs volume and serves a live view of it on :9000. Not on
  # the `secure` or `lab` network (no `networks:` key — see CLAUDE.md), and
  # its published port is loopback-only: viewable from the host (VS Code's
  # Dev Containers extension auto-forwards it), not from anywhere inside the
  # stack.
  observer:
    build: https://github.com/lpezet/secure-agent-lab.git#v1.3.1:stack/observer
    volumes:
      - audit-logs:/var/log/audit:ro
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:9000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Rotates the JSONL files on the shared volume and fixes up its permissions
  # on every start so broker (`node`) and proxy (`mitmproxy`) — different
  # non-root uids — can both write to it. Runs as root deliberately; see
  # stack/log-rotator/ in CLAUDE.md.
  log-rotator:
    build: https://github.com/lpezet/secure-agent-lab.git#v1.3.1:stack/log-rotator
    volumes:
      - audit-logs:/var/log/audit
    restart: unless-stopped

  lab:
    build: ./lab
    depends_on:
      proxy:
        condition: service_healthy
      cred-gateway:
        condition: service_healthy
    volumes:
      - ../:/workspace:cached
      # The workspace mount above is the parent of .devcontainer, so without
      # this the agent could edit addons/, providers/ and gateway.d/ — i.e.
      # widen the proxy allowlist or the cred-gateway whitelist and wait for
      # a restart. Nested mounts win over their parent, so this shadows the
      # whole stack config as read-only while leaving the project writable.
      - ../.devcontainer:/workspace/.devcontainer:ro
      - proxy-certs:/proxy-certs:ro
    environment:
      HTTP_PROXY: http://proxy:8080
      HTTPS_PROXY: http://proxy:8080
      NO_PROXY: localhost,127.0.0.1,cred-gateway
      NODE_EXTRA_CA_CERTS: /proxy-certs/mitmproxy-ca-cert.pem
      REQUESTS_CA_BUNDLE: /proxy-certs/mitmproxy-ca-cert.pem
      SSL_CERT_FILE: /proxy-certs/mitmproxy-ca-cert.pem
      GIT_CREDENTIAL_URL: http://cred-gateway/github/credential
      GITHUB_IDENTITY_URL: http://cred-gateway/github/identity
      GH_TOKEN: proxy-injected
      CLOUDFLARE_API_TOKEN: proxy-injected
    networks: [lab]
    command: sleep infinity

networks:
  # secure is NOT internal: broker calls api.github.com and api.cloudflare.com
  # directly, and the proxy reaches every provider through it.
  secure:
    driver: bridge
  # lab IS internal by default: no default gateway, so the only way out is a
  # container on this network — the proxy. That is what makes 001_allowlist.py
  # enforcing rather than advisory; without it, HTTP_PROXY is a request the
  # agent can decline with `curl --noproxy '*'`.
  #
  # Set LAB_INTERNAL=false to opt out. It costs you the boundary: egress
  # becomes unmediated and check-invariants.sh will say so on every run.
  # The reason to do it is tooling that cannot use an HTTP proxy at all —
  # raw sockets, ssh, anything that resolves before proxying. Proxied HTTP
  # and HTTPS are unaffected either way, because the proxy resolves the
  # hostname, not the client.
  lab:
    driver: bridge
    internal: ${LAB_INTERNAL:-true}

volumes:
  proxy-certs:
  audit-logs:
