# Reference skeleton — the wiring, not a running deployment.
#
# This will NOT work as-is, by design. Three mount points are the seams where
# a deployment supplies its own content, and all of them are empty here:
#
#   ./broker/providers      → /app/providers        (empty)
#   ./cred-gateway/gateway.d → /etc/nginx/gateway.d (empty)
#   ./proxy/addons          → /addons               (populated)
#
# With no providers the broker answers 404 on every credential route, and with
# no gateway snippets cred-gateway denies everything but /healthz — so there is
# no git credential path. That is the same base-is-mechanism split the broker
# and proxy already use: this file shows how the pieces connect, and you bring
# the credentials you actually need.
#
# For a working stack, start from examples/claude-code or
# examples/dev-container — both vendor a github.js provider and a github.conf
# snippet you can copy and extend.
name: example-of-compose-file

services:
  broker:
    build: ./broker
    volumes:
      - ${HOME}/.config/agent-creds:/secrets:ro
      - ./broker/providers:/app/providers:ro
      - audit-logs:/var/log/audit
    env_file: .env
    environment:
      GITHUB_APP_PRIVATE_KEY_PATH: /secrets/github-app.pem
      ANTHROPIC_API_KEY_PATH: /secrets/anthropic.key
      CLOUDFLARE_MINTER_TOKEN_PATH: /secrets/cloudflare-minter.token
      # Must match the proxy's CLOUDFLARE_PROFILE. The broker mints this profile
      # and refuses any other, so the lab cannot ask its way into a wider one.
      CLOUDFLARE_PROFILE: ${CLOUDFLARE_PROFILE:-workers-deploy}
      AUDIT_LOG: /var/log/audit/broker.jsonl
    networks: [secure]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  proxy:
    build: ./proxy
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./proxy/addons:/addons:ro
      - proxy-certs:/home/mitmproxy/.mitmproxy
      - audit-logs:/var/log/audit
      # Uncomment the line below to enable proxy allowlist
      # - ./proxy/allowlist:/etc/agent-allowlist:ro
    environment:
      BROKER_URL: http://broker:8080
      # Which Cloudflare profile the addon injects for. Deployment config, not
      # something the lab container may influence — see bank/cloudflare/.
      CLOUDFLARE_PROFILE: ${CLOUDFLARE_PROFILE:-workers-deploy}
      AUDIT_LOG: /var/log/audit/proxy.jsonl
    networks: [secure, lab]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem",
        ]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  cred-gateway:
    build: ./cred-gateway
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      # Extra whitelisted endpoints for custom providers. Host path only —
      # must not be visible to the lab container.
      - ./cred-gateway/gateway.d:/etc/nginx/gateway.d:ro
      - audit-logs:/var/log/audit
    networks: [secure, lab]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # Reads the audit-logs volume and serves a live view of it on :9000. Not on
  # the `secure` or `lab` network (no `networks:` key — see CLAUDE.md), and
  # its published port is loopback-only: viewable from the host, not from
  # anywhere inside the stack.
  observer:
    build: ./observer
    volumes:
      - audit-logs:/var/log/audit:ro
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:9000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Rotates the JSONL files on the shared volume (logrotate + copytruncate,
  # see stack/log-rotator/logrotate.conf) and fixes up the volume's
  # permissions on every start so broker (`node`) and proxy (`mitmproxy`) —
  # different non-root uids sharing one directory — can both write to it.
  # Runs as root for exactly that reason; needs no network of its own either.
  log-rotator:
    build: ./log-rotator
    volumes:
      - audit-logs:/var/log/audit
    restart: unless-stopped

  lab:
    build: ./lab
    depends_on:
      proxy:
        condition: service_healthy
      cred-gateway:
        condition: service_healthy
    volumes:
      - ../:/workspace:cached
      - proxy-certs:/proxy-certs:ro
    environment:
      HTTP_PROXY: http://proxy:8080
      HTTPS_PROXY: http://proxy:8080
      NO_PROXY: localhost,127.0.0.1,cred-gateway
      NODE_EXTRA_CA_CERTS: /proxy-certs/mitmproxy-ca-cert.pem
      REQUESTS_CA_BUNDLE: /proxy-certs/mitmproxy-ca-cert.pem
      SSL_CERT_FILE: /proxy-certs/mitmproxy-ca-cert.pem
      GIT_CREDENTIAL_URL: http://cred-gateway/github/credential
      GITHUB_IDENTITY_URL: http://cred-gateway/github/identity
      GH_TOKEN: proxy-injected
      CLOUDFLARE_API_TOKEN: proxy-injected
    networks: [lab]
    command: sleep infinity

networks:
  # secure is NOT internal: broker calls api.github.com and api.cloudflare.com
  # directly, and the proxy reaches every provider through it.
  secure:
    driver: bridge
  # lab IS internal by default: no default gateway, so the only way out is a
  # container on this network — the proxy. That is what makes 001_allowlist.py
  # enforcing rather than advisory; without it, HTTP_PROXY is a request the
  # agent can decline with `curl --noproxy '*'`.
  #
  # Set LAB_INTERNAL=false to opt out. It costs you the boundary: egress
  # becomes unmediated and check-invariants.sh will say so on every run.
  # The reason to do it is tooling that cannot use an HTTP proxy at all —
  # raw sockets, ssh, anything that resolves before proxying. Proxied HTTP
  # and HTTPS are unaffected either way, because the proxy resolves the
  # hostname, not the client.
  lab:
    driver: bridge
    internal: ${LAB_INTERNAL:-true}

volumes:
  proxy-certs:
  audit-logs:
